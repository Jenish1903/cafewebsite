<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services</title>
    <link href="./output.css" rel="stylesheet" />
    <link rel="stylesheet" href="../src/CSS/Error.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&family=Open+Sans&family=Lato&family=Montserrat&family=Great Vibes&family=Bellefair&family=Poppins&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <section class="container">
      <div class="firstsection bg-black h-9">
        <div class="flex justify-between pt-1">
          <div class="ml-28 fs_list">
            <i class="bi bi-facebook text-white"></i>
            <i class="bi bi-instagram text-white"></i>
            <i class="bi bi-linkedin text-white"></i>
            <i class="bi bi-twitter text-white"></i>
            <i class="bi bi-telephone text-white"></i>
          </div>
          <div class="mr-28">
            <i class="bi bi-telephone text-white"></i>
            <span class="text-white ml-2 mr-3">Call us: (+1) 123 4567 890</span>

            <i class="bi bi-envelope text-white"></i>
            <span class="text-white ml-2">Mail us: info@havnor.com</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Start header section -->
    <section class="container">
      <nav>
        <div>
          <img src="../Assets/cafelogo.svg" alt="headerlogo" />
        </div>
        <div>
          <ul>
            <a>Home</a>
            <a>Menu</a>
            <a>About Us</a>
            <a>Gallery</a>
            <a>Services</a>
            <a>Contact Us</a>
          </ul>
        </div>
      </nav>
    </section>
    <!-- End header sections -->

    <!-- start background image -->
    <section class="container">
      <div class="errorbg">
        <div class="justify-items-center error">
          <img src="/Assets/error.png" alt="" />
          <h1
            class="[font:normal_normal_normal_35px/43px_Montserrat] tracking-[0px] text-[#FFFFFF] opacity-100"
          >
            Whoops....
          </h1>
          <p
            class="mt-5 [font:normal_normal_normal_20px/24px_Montserrat] tracking-[0px] text-[#FFFFFF] opacity-70"
          >
            We can't seem to find the page you are looking for
          </p>
          <div class="mt-3">
            <i class="bi bi-arrow-right text-white mr-3"></i>
            <button
              class="[font:normal_normal_normal_35px/40px_Bellefair] tracking-[0px] text-[#FFFFFF] opacity-100"
            >
              Back to Home page
            </button>
          </div>
        </div>
      </div>
    </section>
    <!-- End background image -->
  </body>
</html>
